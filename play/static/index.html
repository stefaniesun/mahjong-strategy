    .quick-action b {
      display: block;
      font-size: 15px;
    }

    .quick-action.secondary {
      opacity: .78;
    }

    .card {
      background: var(--panel);
      color: var(--panel-ink);
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    .card>summary {
      list-style: none;
      cursor: pointer;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, #fffaf0, #efe6d2);
      border-bottom: 1px solid #e1d6bd;
    }

    .card>summary::-webkit-details-marker {
      display: none;
    }

    .card>summary::before {
      content: "▾";
      color: #a08c63;
      font-size: 12px;
      transition: transform .15s;
    }

    .card:not([open])>summary::before {
      transform: rotate(-90deg);
    }

    .card>summary .num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #3a3226;
      color: var(--gold);
      display: grid;
      place-items: center;
      font-size: 11px;
    }

    .card>summary .hint {
      font-weight: 400;
      font-size: 11px;
      color: var(--muted);
      margin-left: auto;
    }

    .card .body {
      padding: 8px 12px 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .tier {
      display: inline-block;
      padding: 0 6px;
      border-radius: 8px;
      font-size: 11px;
      color: #fff;
      margin-right: 5px;
      vertical-align: 1px;
    }

    .tier.t1 {
      background: var(--t1);
    }

    .tier.t2 {
      background: var(--t2);
    }

    .tier.t3 {
      background: var(--t3);
    }

    .finding {
      margin: 4px 0;
    }

    .finding details {
      margin: 2px 0 0 4px;
      font-size: 12px;
      color: #6a6355;
    }

    .finding details summary {
      cursor: pointer;
      color: #9a8a66;
    }

    .finding ul {
      margin: 2px 0;
      padding-left: 18px;
    }

    .assume {
      font-size: 11px;
      color: #a07018;
      margin-top: 2px;
    }

    .criterion {
      font-size: 11px;
      color: var(--muted);
      margin: 2px 0 6px;
    }

    .flag {
      display: inline-block;
      background: #fff1d6;
      color: #8a5200;
      border: 1px solid #f0d49b;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
      margin: 0 4px 4px 0;
    }

    table.t {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    table.t th {
      text-align: left;
      color: #8c7f62;
      font-weight: 600;
      font-size: 11px;
      padding: 3px 4px;
      border-bottom: 1px solid #e3d9c2;
    }

    table.t td {
      padding: 3px 4px;
      border-bottom: 1px solid #efe7d6;
      vertical-align: middle;
    }

    table.t tr.hl td {
      background: #fff3c9;
    }

    table.t tr.clickable {
      cursor: pointer;
    }

    table.t tr.clickable:hover td {
      background: #fbf1d8;
    }

    .safe {
      color: #1d7a3e;
      font-weight: 700;
    }

    .p3 {
      color: #a76a0a;
    }

    .err {
      color: #c0392b;
      font-weight: 700;
    }

    .rem-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 8px 3px;
    }

    .rem-cell {
      min-width: 0;
      text-align: center;
      line-height: 1.15;
    }

    .rem-cell .tile {
      display: block;
      --riv-w: 100%;
      --riv-h: auto;
      aspect-ratio: 5 / 7;
      max-width: 34px;
      margin: 0 auto 5px;
    }

    .rem-cell b {
      display: block;
      font-size: 15px;
    }

    .rem-cell span {
      display: block;
      min-height: 12px;
      color: #b38a3a;
      font-size: 10px;
    }

    .rem-cell.last b {
      color: #c8452d;
    }

    .rem-cell.zero b {
      color: #a59f90;
      font-size: 12px;
    }

    .rem-cell.zero .tile {
      filter: grayscale(1);
      opacity: .4;
    }

    .winner-card {
      border: 1px solid #ead9b5;
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 6px;
      background: #fffdf6;
    }

    .muted {
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      padding: 4px 0;
    }

    /* ---------- 弹层 ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 10, .7);
      display: grid;
      place-items: center;
      z-index: 50;
      animation: fadein .25s;
    }

    .modal {
      width: min(920px, 92vw);
      max-height: 88vh;
      overflow: auto;
      background: linear-gradient(180deg, #232733, #171a22);
      border: 1px solid var(--gold-lo);
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .7);
      padding: 20px 24px;
    }

    .modal h3 {
      margin: 0 0 12px;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 30px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 6px;
      font-weight: 400;
    }

    .res-row {
      display: grid;
      grid-template-columns: 130px 1fr 90px 90px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #2c3140;
    }

    .res-row .nm {
      font-size: 15px;
    }

    .res-row .nm small {
      display: block;
      color: #9d978a;
      font-size: 12px;
    }

    .res-row .delta {
      font-size: 22px;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .res-row .tot {
      text-align: right;
      color: #c9c3b4;
      font-size: 13px;
    }

    .res-tiles {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0;
    }

    .res-tiles .sep {
      width: 10px;
    }

    .modal .foot {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
    }

    .mark-box textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 10px;
      border: 1px solid #3a4054;
      background: #0f1218;
      color: #eee;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      background: #2a2f3d;
      border: 1px solid var(--gold-lo);
      color: #f1e8cf;
      padding: 8px 18px;
      border-radius: 20px;
      z-index: 60;
      animation: fadein .2s;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 18px;
    }

    .orientation-hint {
      display: none;
    }

    @media (max-width: 900px) and (orientation: portrait) {
      .orientation-hint {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        padding: 28px;
        text-align: center;
        color: var(--gold-hi);
        background: radial-gradient(circle at 50% 40%, #26382f, #0d0f14 72%);
        font-size: 20px;
        line-height: 1.7;
      }

      .orientation-hint::before {
        content: "↻";
        display: block;
        font-size: 62px;
        line-height: 1;
        color: var(--gold);
        margin-bottom: 14px;
      }

      .app {
        visibility: hidden;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      :root {
        --hand-w: clamp(34px, 5.6vw, 54px);
        --hand-h: clamp(50px, 8.5vw, 76px);
        --riv-w: clamp(24px, 4vw, 34px);
        --riv-h: clamp(34px, 5vw, 47px);
      }

      body {
        min-width: 0;
      }

      .app {
        grid-template-rows: 38px 1fr;
      }

      .topbar {
        gap: 8px;
        padding: 0 9px;
        min-width: 0;
      }

      .brand {
        font-size: 17px;
        letter-spacing: 1px;
        white-space: nowrap;
      }

      .brand small {
        display: none;
      }

      .topinfo {
        gap: 6px;
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
      }

      .scoreboard,
      .speed {
        display: none;
      }

      .main {
        display: block;
        position: relative;
      }

      .stage {
        height: calc(100vh - 38px);
        padding: 5px;
      }

      .frame {
        padding: 7px;
        border-radius: 13px;
      }

      .frame::after {
        inset: 4px;
        border-radius: 10px;
      }

      .felt {
        border-radius: 8px;
        grid-template-columns: 78px 1fr 78px;
        grid-template-rows: 72px 1fr 112px;
      }

      .aside {
        display: none;
      }

      .myrow {
        gap: 7px;
        padding-left: 78px;
        padding-right: 8px;
      }

      .tile.hand {
        margin-right: 1px;
        margin-bottom: 4px;
        border-radius: 4px;
      }

      .drawn-gap {
        width: 7px;
      }

      .actions {
        right: 10px;
        bottom: 65px;
        gap: 5px;
      }

      .btn-act {
        min-width: 52px;
        padding: 6px 8px;
        border-radius: 8px;
        font-size: 15px;
        letter-spacing: 0;
      }

      .center {
        gap: 3px;
        padding: 3px;
      }

      .compass {
        width: 82px;
        height: 82px;
        border-radius: 12px;
      }

      .compass .wall {
        font-size: 19px;
      }

      .compass .lbl,
      .compass .dir {
        font-size: 9px;
      }

      .zone {
        gap: 3px;
      }

      .plate {
        transform: scale(.78);
        transform-origin: center;
      }

      .river {
        transform: scale(.78);
        transform-origin: center;
      }

      .hint-box {
        max-width: 170px;
        font-size: 11px;
      }

      .toast {
        top: 44px;
        font-size: 12px;
        padding: 5px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="orientation-hint">请将手机横向旋转<br><small>横屏后即可开始四川麻将对局</small></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">四川麻将<small>血战到底</small></div>
      <div class="topinfo" id="topinfo"></div>
      <div class="spacer"></div>
      <div class="scoreboard" id="scoreboard"></div>
      <button class="pause-btn" id="pauseBtn" title="暂停/继续 AI 自动出牌">⏸ 暂停</button>
      <button class="pause-btn" id="stepBtn" title="暂停状态下点一下推进 1 步 AI 动作" style="display:none">⏭ 下一步</button>
      <div class="speed" style="gap:6px">节奏
        <input id="speedRange" type="range" min="500" max="4000" step="100" value="1800"
          style="width:92px;accent-color:#e8c46a;cursor:pointer" title="拖动自由调节每步间隔(0.5秒 ~ 4.0秒)" />
        <span id="speedVal" style="min-width:34px;font-weight:700;color:#ffd36a;font-size:12px">1.8s</span>
        <div class="seg" id="speed"><button data-v="2600">2.6s</button><button data-v="1800">1.8s</button><button
            data-v="1000">1.0s</button></div>
      </div>
    </header>
    <div class="main">
      <section class="stage">
        <div class="frame">
          <div class="felt" id="felt"></div>
        </div>
      </section>
      <aside class="aside">
        <div class="aside-head">
          <h2>打牌辅助</h2>
          <div class="legend"><span class="tier t1">确定</span><span class="tier t2">计数</span><span
              class="tier t3">概率</span></div>
          <button class="mark-btn" id="markBtn" title="对当前局面给辅助器提实时反馈(自动记录牌面+推荐+真实复盘线索)">🚩 实时反馈</button>
        </div>
        <div class="aside-body" id="aside">
          <div class="empty">载入中…</div>
        </div>
      </aside>
    </div>
  </div>
  <div id="layer"></div>

  <script>
    'use strict';
    // ---------- 工具 ----------
    const SUIT_IMG = { W: 'Man', T: 'Sou', B: 'Pin' };
    const SUIT_CN = { W: '万', T: '条', B: '筒' };
    const CN_SUIT = { '万': 'W', '条': 'T', '筒': 'B' };
    const SUIT_ORDER = { W: 0, T: 1, B: 2 };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pct = p => (p * 100).toFixed(0) + '%';
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const fromLabel = l => { const s = String(l); return s.slice(0, -1) + CN_SUIT[s.slice(-1)]; };
    const img = code => `<img src="/tiles/${SUIT_IMG[code.slice(-1)]}${code.slice(0, -1)}.png" alt="${esc(code)}">`;
    function tileHtml(code, cls = '', attrs = '') {
      if (!code) return `<span class="tile back ${cls}" ${attrs}></span>`;
      return `<span class="tile ${cls}" ${attrs} title="${esc(code.slice(0, -1) + SUIT_CN[code.slice(-1)])}">${img(code)}</span>`;
    }
    const miniL = label => tileHtml(fromLabel(label), 'mini');
    const minisL = list => (list || []).map(miniL).join('');
    const signed = n => (n > 0 ? '+' : '') + n;
    const cls = n => (n > 0 ? 'pos' : n < 0 ? 'neg' : '');

    // 视角位置:0 自己(下) 1 下家(右) 2 对家(上) 3 上家(左)
    const POS = ['bottom', 'right', 'top', 'left'];

    let view = null;
    let busy = false;
    let selected = [];          // 换三张已选的手牌下标 / 出牌预选
    let hoverTile = null;
    let lastEventN = 0;
    let fastForward = false;
    let paused = false;
    let lastDiscardSeat = null;
    let delay = 1800;
    try {
      const saved = Number(localStorage.getItem('mj.delay.v3'));
      if (saved >= 500 && saved <= 4000) delay = saved;
    } catch (e) { }

    async function api(path, body) {
      const res = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
      if (!res.ok) { const t = await res.json().catch(() => ({})); throw new Error(t.detail || res.statusText); }
      return res.json();
    }
    function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

    // ---------- 牌桌 ----------
    function plate(seat, posCls) {
      const v = view;
      const suit = seat.void;
      const dealer = v.dealer === seat.seat ? '<span class="badge-dealer">庄</span>' : '';
      const active = v.current === seat.seat && !v.finished ? 'active' : '';
      const avatar = seat.is_ai ? 'AI' : '我';
      const voidChip = suit ? `<span class="void-chip ${suit}">缺${SUIT_CN[suit]}</span>` : '<span class="void-chip none">未定缺</span>';
      const won = seat.won && seat.win;
      const wonTag = won ? `<div class="won-tag">${esc(seat.win.how)} · 第${seat.win.order}家</div>` : '';
      const thisHand = seat.score !== 0 && seat.score !== seat.total ? `<small>本局 ${signed(seat.score)}</small>` : '';
      return `<div class="plate ${posCls} ${active} ${won ? 'won' : ''} ${suit ? 'void-' + suit : ''}">${wonTag}<div class="avatar">${avatar}</div>
    <div class="info"><div class="who">${esc(seat.name)} ${dealer}</div>${voidChip}</div>
    <div class="score-box" title="累计得分"><div class="score ${cls(seat.total)}">${signed(seat.total)}</div>${thisHand}</div></div>`;
    }
    function meldsHtml(seat, dir) {
      const side = dir === 'left' || dir === 'right';
      const rot = dir === 'left' ? '90deg' : '-90deg';
      return seat.melds.map(m => {
        const n = m.kind === 'kong' ? 4 : 3;
        const tiles = [];
        for (let i = 0; i < n; i++) {
          const hide = m.concealed && (i === 0 || i === 3);
          const c = side ? `side meld` : 'meld';
          tiles.push(hide ? `<span class="tile back ${c}"></span>` : tileHtml(m.tile, c + (m.concealed ? ' dim' : ''), side ? `style="--rot:${rot}"` : ''));
        }
        return `<div class="meld ${side ? 'col' : ''}">${tiles.join('')}</div>`;
      }).join('');
    }
    function winTileHtml(seat, dir) {
      if (!seat.won || !seat.win || !seat.win.tile) return '';
      const side = dir === 'left' || dir === 'right';
      const rot = dir === 'left' ? '90deg' : '-90deg';
      return tileHtml(seat.win.tile, `${side ? 'side ' : ''}win-tile won-tile`, side ? `style="--rot:${rot}"` : '');
    }
    function backsHtml(seat, dir) {
      const known = seat.known_tiles || [];
      const inferred = seat.inferred_tiles || [];
      const n = seat.hidden;
      const win = winTileHtml(seat, dir);
      const knownHtml = known.map(code => tileHtml(code, 'known-tile')).join('');
      const infHtml = inferred.map(code => tileHtml(code, 'inferred-tile', `title="断张/组合100%反推必有"`)).join('');
      if (dir === 'top') return `<div class="backs-row">${'<span class="tile back"></span>'.repeat(n)}${knownHtml}${infHtml}${win}</div>`;
      const rot = dir === 'left' ? '90deg' : '-90deg';
      const sideKnown = known.map(code => tileHtml(code, 'side known-tile', `style="--rot:${rot}"`)).join('');
      const sideInf = inferred.map(code => tileHtml(code, 'side inferred-tile', `style="--rot:${rot}" title="断张/组合100%反推必有"`)).join('');
      return `<div class="backs-col">${'<span class="tile back side"></span>'.repeat(n)}${sideKnown}${sideInf}${win}</div>`;
    }
    function riverHtml(seat, dir) {
      const pend = view.pending && view.pending.seat === seat.seat;
      const isLastDis = lastDiscardSeat === seat.seat;
      const side = dir === 'left' || dir === 'right';
      const rot = dir === 'left' ? '90deg' : '-90deg';
      return seat.river.map((code, i) => {
        let c = side ? 'side' : '';
        const last = i === seat.river.length - 1;
        if (last && (pend || isLastDis)) c += ' latest';
        if (last && freshSeats.has(seat.seat)) c += ' fresh';
        return tileHtml(code, c, side ? `style="--rot:${rot}"` : '');
      }).join('');
    }
    let freshSeats = new Set();

    function renderTable() {
      const v = view;
      const s = v.seats;
      const top = s[2], left = s[3], right = s[1], me = s[0];
      const curPos = v.finished || v.current === null ? -1 : v.current;
      const dirs = [0, 1, 2, 3].map(i => {
        const vs = s[i].void;
        const vpill = vs
          ? `<span class="vpill ${vs}">缺${SUIT_CN[vs]}</span>`
          : (v.phase === 'play' || v.phase === 'finished' ? '' : '<span class="vpill none">未缺</span>');
        return `<div class="dir d${i} ${curPos === i ? 'on' : ''}"><span>${['自己', '下家', '对家', '上家'][i]}</span>${vpill}</div><div class="bar b${i} ${curPos === i ? 'on' : ''}"></div>`;
      }).join('');
      const phaseText = { swap_three: '换三张', declare_void: '定缺', play: '行牌', finished: '本局结束' }[v.phase] || v.phase;

      let html = `
  <div class="zone z-top">${plate(top, 'p-top')}
    <div style="display:flex;gap:14px;align-items:flex-end">${backsHtml(top, 'top')}<div class="melds">${meldsHtml(top, 'top')}</div></div></div>
  <div class="zone z-left">${plate(left, 'p-left')}
    <div class="melds col">${meldsHtml(left, 'left')}</div>${backsHtml(left, 'left')}</div>
  <div class="zone z-right">${plate(right, 'p-right')}
    <div class="melds col">${meldsHtml(right, 'right')}</div>${backsHtml(right, 'right')}</div>
  <div class="center">
    <div class="river r-top">${riverHtml(top, 'top')}</div>
    <div class="river r-left">${riverHtml(left, 'left')}</div>
    <div class="compass">${dirs}<div class="mid"><div class="wall">${v.wall}</div><div class="lbl">余牌 · ${phaseText}</div></div></div>
    <div class="river r-right">${riverHtml(right, 'right')}</div>
    <div class="river r-bot">${riverHtml(me, 'bottom')}</div>
  </div>
  <div class="zone z-bottom">${plate(me, 'p-bottom')}
    <div class="myrow"><div class="hand" id="hand">${myHandHtml()}</div>${me.won && me.win && me.win.tile ? `<div class="win-mine">${tileHtml(me.win.tile, 'hand won-tile')}</div>` : ''}<div class="melds">${meldsHtml(me, 'bottom')}</div></div>
  </div>
  <div class="ticker" id="ticker">${v.events.slice(-6).map(e => `<div>${esc(e.text)}</div>`).join('')}</div>
  <div id="suitHudWrap">${suitHudHtml()}</div>
  <div id="tenpaiDockWrap">${tenpaiDockHtml()}</div>
  ${actionsHtml()}`;
      document.getElementById('felt').innerHTML = html;
      bindHand();
    }

    let suitHudCollapsed = false;
    let suitHudSelected = null;
    function setSuitHudTab(s) {
      suitHudSelected = s;
      const w = document.getElementById('suitHudWrap');
      if (w) w.innerHTML = suitHudHtml();
    }
    function toggleSuitHud() {
      suitHudCollapsed = !suitHudCollapsed;
      const w = document.getElementById('suitHudWrap');
      if (w) w.innerHTML = suitHudHtml();
    }

    function activeWaitCodes() {
      const set = new Set();
      const info = view?.report?.own_info;
      if (!info) return set;
      let waits = null;
      if (info.mode === 'wait' && info.shanten === 0 && info.waits?.length) waits = info.waits;
      else if (info.mode === 'discard') {
        const tp = tenpaiDiscardMap();
        const chosen = tp.best;
        if (chosen && chosen.waits?.length) waits = chosen.waits;
      }
      if (waits) waits.forEach(w => set.add(fromLabel(w.tile)));
      return set;
    }

    function suitHudHtml() {
      const v = view;
      if (!v || v.finished || v.phase !== 'play' || v.seats?.[0]?.won) return '';
      const list = v.report?.suit_inference;
      if (!list || !list.length) return '';
      const nonVoid = list.filter(s => !s.is_my_void);
      if (!nonVoid.length) return '';
      const hasWinner = v.seats.some(s => s.won);
      const hasVoid2 = nonVoid.some(s => s.opp_void_count >= 2);
      if (!hasWinner && !hasVoid2 && v.wall > 24) return '';

      const waits = activeWaitCodes();
      // 默认优先展示: 用户手动选的花色 -> 当前听口最集中的花色 -> 对手缺门最多/已胡线索最多的花色
      let cur = nonVoid.find(s => s.suit === suitHudSelected);
      if (!cur) {
        const waitCounts = {};
        waits.forEach(c => { const su = c.slice(-1); waitCounts[su] = (waitCounts[su] || 0) + 1; });
        cur = nonVoid.slice().sort((a, b) =>
          (waitCounts[b.suit] || 0) - (waitCounts[a.suit] || 0)
          || b.opp_void_count - a.opp_void_count
          || b.winner_expected - a.winner_expected
          || b.wall_share - a.wall_share
        )[0];
      }
      if (!cur) return '';

      if (suitHudCollapsed) {
        return `<div class="suit-hud collapsed"><div class="sh-top"><span class="sh-title">🔍 ${esc(cur.label)}子推理</span><button class="sh-toggle" onclick="toggleSuitHud()">展开</button></div></div>`;
      }

      const tabs = nonVoid.map(s => `<button class="sh-tab ${s.suit === cur.suit ? 'on' : ''}" onclick="setSuitHudTab('${s.suit}')">${esc(s.label)}</button>`).join('');
      const voidPill = cur.opp_void_count > 0
        ? `<span class="sh-pill ${cur.opp_void_count >= 2 ? 'void2' : ''}">${cur.opp_void_count}家缺${esc(cur.label)}(${cur.void_seats.map(esc).join('、')})</span>`
        : '';
      const wallPct = Math.round((cur.wall_share || 0) * 100);
      const pills = `${voidPill}<span class="sh-pill wall">墙内 ≈${cur.wall_expected.toFixed(1)}/${v.wall} (${wallPct}%)</span>`
        + (cur.winner_expected >= 0.2 ? `<span class="sh-pill win">已胡估扣 ≈${cur.winner_expected.toFixed(1)}</span>` : '')
        + `<span class="sh-pill">在场对手 ≈${cur.active_opp_expected.toFixed(1)}</span>`;

      const enums = v.report?.endgame_enums || [];
      const enumHtml = enums.map(em => {
        const flTxt = em.flush_suit_label
          ? `<span style="background:rgba(244,63,94,.22);border:1px solid rgba(251,113,133,.55);color:#fecdd3;padding:1px 5px;border-radius:5px;font-weight:700">清${esc(em.flush_suit_label)}≈${Math.round(em.flush_prob * 100)}%</span>`
          : '';
        const topW = (em.top_waits || []).slice(0, 4).map(w => `<span>${esc(w.tile)} ${Math.round(w.dealin_prob * 100)}%</span>`).join('');
        return `<div class="sh-clue" style="background:rgba(244,63,94,.09);border-color:rgba(251,113,133,.32)"><div class="sh-clue-hd" style="color:#fda4af;display:flex;align-items:center;justify-content:space-between;gap:4px"><span>🎯 <b>${esc(em.name)}</b>(余${em.hidden_count}暗 · ${em.tenpai_hand_count}听型)</span>${flTxt}</div><div style="font-size:10px;color:#cbd5e1;margin-bottom:3px">${esc(em.supply_note)}</div>${topW ? `<div class="sh-hot">${topW}</div>` : ''}</div>`;
      }).join('');

      const clues = (cur.winner_clues || []).map(cl => {
        const sureHtml = (cl.certain_tiles || []).map(ct => `<span style="background:rgba(56,189,248,.28);border:1px solid rgba(125,211,252,.65);color:#e0f2fe">必有 ${esc(ct.tile)}${ct.count > 1 ? '×' + ct.count : ''}</span>`).join('');
        const hotHtml = (cl.hot_tiles || []).slice(0, 4).map(h => `<span>${esc(h.tile)} ${Math.round(h.prob * 100)}%</span>`).join('');
        const cntTxt = cl.candidate_count ? `${cl.candidate_count}种组合` : '已反推';
        return `<div class="sh-clue"><div class="sh-clue-hd"><b>${esc(cl.name)}</b> ${esc(cl.how)}${esc(cl.tile)} (${cntTxt} · 估扣${cl.suit_expected.toFixed(1)}张${esc(cur.label)})</div>${(sureHtml || hotHtml) ? `<div class="sh-hot">${sureHtml}${hotHtml}</div>` : ''}</div>`;
      }).join('');

      const grid = (cur.tiles || []).map(t => {
        const code = `${t.rank}${cur.suit}`;
        const isW = waits.has(code);
        const eff = t.effective_unseen !== undefined ? t.effective_unseen : t.unseen;
        const locked = Number(t.certain_locked) || 0;
        const zero = eff === 0;
        const statusLbl = t.unseen === 0 ? '绝' : (eff === 0 ? '锁绝' : (locked > 0 ? '实余' + eff : '余' + t.unseen));
        const wk = locked > 0
          ? `<span class="ck" style="color:#7dd3fc;font-weight:700">必扣${locked}</span>`
          : (t.winner_expected >= 0.25 ? `<span class="ck">扣${t.winner_expected.toFixed(1)}</span>` : '');
        const tip = `${t.tile} · 牌面未现 ${t.unseen} 张${locked ? ` (已胡100%锁死 ${locked} 张, 实际在外 ${eff} 张)` : ''} | 墙内估 ${t.wall_expected.toFixed(2)} | 已胡估扣 ${t.winner_expected.toFixed(2)} | 在场对手 ${t.active_opp_expected.toFixed(2)}`;
        return `<div class="sh-cell ${zero ? 'zero' : ''} ${isW ? 'is-wait' : ''}" title="${esc(tip)}">${tileHtml(code, 'mini')}<div class="sh-cmeta"><b>${statusLbl}</b><span class="cw">${zero ? '' : '墙' + t.wall_expected.toFixed(1)}</span>${wk}</div></div>`;
      }).join('');

      return `<div class="suit-hud"><div class="sh-top"><span class="sh-title">🔍 ${esc(cur.label)}子推理</span><div style="display:flex;align-items:center;gap:4px"><div class="sh-tabs">${tabs}</div><button class="sh-toggle" onclick="toggleSuitHud()">收起</button></div></div><div class="sh-pills">${pills}</div>${enumHtml}${clues}<div class="sh-grid">${grid}</div></div>`;
    }

    function tenpaiDiscardMap() {
      const out = { map: {}, best: null };
      const v = view;
      if (!v || v.finished || v.phase !== 'play' || v.seats?.[0]?.won) return out;
      const info = v.report?.own_info;
      const legalDisc = v.decision?.discard || [];
      if (!info || info.mode !== 'discard' || !legalDisc.length) return out;
      const list = (info.discard_v2_options && info.discard_v2_options.length) ? info.discard_v2_options : (info.candidates || []);
      for (const c of list) {
        if (c.shanten_after !== 0 || !c.waits || !c.waits.length) continue;
        const code = fromLabel(c.tile);
        if (!legalDisc.includes(code)) continue;
        if (!out.map[code]) out.map[code] = c;
        if (!out.best) out.best = c;
      }
      return out;
    }

    function tenpaiDockHtml(previewCode = null) {
      const v = view;
      if (!v || v.finished || v.phase !== 'play' || v.seats?.[0]?.won) return '';
      const info = v.report?.own_info;
      if (!info) return '';

      let waits = null;
      let headHtml = '';
      if (info.mode === 'wait' && info.shanten === 0 && info.waits && info.waits.length) {
        waits = info.waits;
        const total = waits.reduce((s, w) => s + (Number(w.remaining) || 0), 0);
        headHtml = total > 0 ? '听牌' : '死听';
      } else if (info.mode === 'wait') {
        // 若正在响应碰牌且碰后直接听牌，主桌浮条直接预览碰后听口与墙内实余！
        const pAlert = (v.report?.sections?.alerts || []).find(f => f.data && f.data.waits_after && f.data.waits_after.length);
        if (pAlert) {
          waits = pAlert.data.waits_after;
          headHtml = `碰${miniL(pAlert.data.pong_tile)}打${miniL(pAlert.data.best_discard)}听`;
        }
      } else if (info.mode === 'discard') {
        const tp = tenpaiDiscardMap();
        let chosen = null;
        if (previewCode && tp.map[previewCode]) {
          chosen = tp.map[previewCode];
        } else if (selected.length === 1) {
          const selCode = selected[0] === 'drawn' ? v.drawn : v.hand[selected[0]];
          if (selCode && tp.map[selCode]) chosen = tp.map[selCode];
        }
        if (!chosen) chosen = tp.best;
        if (chosen && chosen.waits && chosen.waits.length) {
          waits = chosen.waits;
          headHtml = `打 ${miniL(chosen.tile)} 听`;
        }
      }
      if (!waits || !waits.length) return '';

      const totalLive = waits.reduce((s, w) => s + (Number(w.remaining) || 0), 0);
      const deadAll = totalLive === 0;
      const itemsHtml = waits.map(w => {
        const code = fromLabel(w.tile);
        const rem = Number(w.remaining) || 0;
        const remCls = rem >= 2 ? 'ok' : (rem === 1 ? 'low' : 'zero');
        const remTxt = rem > 0 ? `剩 ${rem} 张` : '已绝';
        const fan = Number(w.fan) || 0;
        const fanCls = fan >= 2 ? 'hi' : (fan === 1 ? 'mid' : '');
        const fanTxt = fan > 0 ? `${fan}番` : '平胡';
        const hasInf = rem > 0 && w.wall_expected !== undefined;
        const wExp = Number(w.wall_expected) || 0;
        const winExp = Number(w.winner_expected) || 0;
        const isHollow = hasInf && wExp < 0.45 && winExp >= 0.7;
        const wLock = winExp >= 0.25 ? ` <span class="wlock">扣≈${winExp.toFixed(1)}</span>` : '';
        const hollowTag = isHollow ? ` <span style="background:rgba(245,158,11,.28);color:#fde68a;border-radius:4px;padding:0 3px;font-weight:700">疑空</span>` : '';
        const infHtml = hasInf ? `<span class="td-inf">墙≈${wExp.toFixed(1)}${wLock}${hollowTag}</span>` : '';
        return `<div class="td-item ${rem === 0 ? 'dead' : ''}">${tileHtml(code, 'mini')}<div class="td-meta"><span class="td-rem ${remCls}">${remTxt}</span><span class="td-fan ${fanCls}">${fanTxt}</span>${infHtml}</div></div>`;
      }).join('');
      const totWall = waits.reduce((s, w) => s + (Number(w.wall_expected) || 0), 0);
      const hasWall = waits.some(w => w.wall_expected !== undefined);
      const sumSub = hasWall && totalLive > 0 ? ` · 墙≈<b>${totWall.toFixed(1)}</b>` : '';
      return `<div class="tenpai-dock ${deadAll ? 'dead' : ''}"><div class="td-head"><div class="td-title">${headHtml}</div><div class="td-sum">牌面 <b>${totalLive}</b> 张${sumSub}</div></div><div class="td-list">${itemsHtml}</div></div>`;
    }

    function updateTenpaiPreview(code) {
      const wrap = document.getElementById('tenpaiDockWrap');
      if (wrap) wrap.innerHTML = tenpaiDockHtml(code);
    }

    function sortedHand() {
      const v = view;
      const vs = v.seats[0].void;
      const key = c => (c.slice(-1) === vs ? 10 : SUIT_ORDER[c.slice(-1)]) * 10 + Number(c.slice(0, -1));
      return v.hand.map((c, i) => ({ c, i })).sort((a, b) => key(a.c) - key(b.c));
    }
    function myHandHtml() {
      const v = view;
      const d = v.decision;
      const vs = v.seats[0].void;
      const canDiscard = d && d.discard.length > 0;
      const canSwap = d && d.swap;
      const tpMap = canDiscard ? tenpaiDiscardMap().map : {};
      const me = v.seats[0];
      let shownApart = me.won && me.win && me.win.how === '自摸' ? me.win.tile : null;
      const inHand = sortedHand().filter(({ c }) => {
        if (c !== shownApart) return true;
        shownApart = null;
        return false;
      });
      const items = inHand.map(({ c, i }) => {
        let k = 'hand';
        if (canDiscard && d.discard.includes(c)) k += ' can';
        if (canSwap) k += ' can';
        if (selected.includes(i)) k += ' sel';
        if (vs && c.slice(-1) === vs && v.phase !== 'swap_three') k += ' void-suit';
        if (canDiscard && tpMap[c]) k += ' tenpai-can';
        if (hoverTile && hoverTile === c) k += ' hint';
        return tileHtml(c, k, `data-i="${i}" data-c="${c}"`);
      });
      if (v.drawn) {
        let k = 'hand';
        if (canDiscard) k += ' can';
        if (selected.includes('drawn')) k += ' sel';
        if (vs && v.drawn.slice(-1) === vs) k += ' void-suit';
        if (canDiscard && tpMap[v.drawn]) k += ' tenpai-can';
        items.push('<span class="drawn-gap"></span>' + tileHtml(v.drawn, k, `data-i="drawn" data-c="${v.drawn}"`));
      }
      return items.join('');
    }

    function actionsHtml() {
      const v = view;
      const d = v.decision;
      if (v.finished) return '';
      if (!d) {
        const meWon = v.seats[0].won;
        return meWon ? `<div class="actions"><button class="btn-act pass" onclick="toggleFast()">${fastForward ? '恢复正常速度' : '快进到结束'}</button></div>` : '';
      }
      if (d.swap) {
        const n = selected.length;
        return `<div class="prompt">选三张<b>同一花色</b>的牌换给${esc(swapTarget())}(点辅助栏里的方案可一键选中)
      <div class="row"><button class="btn-act" ${n === 3 ? '' : 'disabled'} onclick="confirmSwap()">换出 (${n}/3)</button></div></div>`;
      }
      if (d.void.length) {
        const counts = { W: 0, T: 0, B: 0 };
        v.hand.forEach(c => counts[c.slice(-1)]++);
        return `<div class="prompt">定缺:选一门这局不要的花色
      <div class="row">${d.void.map(s => `<button class="suitbtn ${s}" onclick="declareVoid('${s}')">缺${SUIT_CN[s]}<small>手里 ${counts[s]} 张</small></button>`).join('')}</div></div>`;
      }
      const hasWin = d.buttons.some(b => b.kind === 'win');
      const hasPong = d.buttons.some(b => b.kind === 'pong');
      const passBtn = d.buttons.find(b => b.kind === 'pass');
      const pendingTile = (v.pending && v.pending.seat !== 0) ? v.pending.tile : null;
      const inHandCnt = pendingTile ? (v.hand || []).filter(c => c === pendingTile).length : 0;
      const canPongAfterPass = hasWin && !hasPong && !!passBtn && !v.seats[0].won && inHandCnt >= 2;
      const canKongAfterPass = canPongAfterPass && inHandCnt >= 3 && (v.wall || 0) > 1;

      const btnParts = [];
      for (const b of d.buttons) {
        if (b.kind === 'pass' && canPongAfterPass) {
          btnParts.push(`<button class="btn-act" title="先弃胡并立即碰此张（注意：弃胡后本圈触发过水胡锁，下巡摸牌解锁）" onclick="passWinThenAct(${passBtn.index}, 'pong')">碰<small style="font-size:10px;opacity:.85;display:block;line-height:1;margin-top:2px">弃胡改碰</small></button>`);
          if (canKongAfterPass) {
            btnParts.push(`<button class="btn-act" title="先弃胡并立即明杠此张（注意：弃胡后本圈触发过水胡锁，下巡摸牌解锁）" onclick="passWinThenAct(${passBtn.index}, 'kong')">杠<small style="font-size:10px;opacity:.85;display:block;line-height:1;margin-top:2px">弃胡改杠</small></button>`);
          }
        }
        const k = ['win', 'self_win', 'rob_kong_win'].includes(b.kind) ? 'win' : b.kind === 'pass' ? 'pass' : '';
        const titleAttr = (b.kind === 'pass' && canPongAfterPass) ? ' title="先弃胡（下一步可继续选碰或过）"' : '';
        btnParts.push(`<button class="btn-act ${k}"${titleAttr} onclick="pressButton(${b.index})">${esc(b.label)}</button>`);
      }
      const btns = btnParts.join('');
      const tip = d.discard.length ? '' : '';
      return `<div class="actions">${btns}</div>${tip}`;
    }
    function swapTarget() {
      const d = view.swap_direction;
      const to = ((0 - d) % 4 + 4) % 4;
      return ['自己', '下家', '对家', '上家'][to];
    }

    function bindHand() {
      document.querySelectorAll('#hand .tile').forEach(el => {
        el.addEventListener('click', () => onTileClick(el.dataset.i, el.dataset.c));
        el.addEventListener('dblclick', () => { const d = view.decision; if (d && d.discard.includes(el.dataset.c)) discard(el.dataset.c); });
        el.addEventListener('mouseenter', () => { highlightRows(el.dataset.c); updateTenpaiPreview(el.dataset.c); });
        el.addEventListener('mouseleave', () => { highlightRows(null); updateTenpaiPreview(null); });
      });
    }
    function highlightRows(code) {
      document.querySelectorAll('[data-row-tile]').forEach(tr => tr.classList.toggle('hl', code !== null && tr.dataset.rowTile === code));
    }
    function onTileClick(i, code) {
      const d = view.decision;
      if (!d || busy) return;
      if (d.swap) {
        const key = i === 'drawn' ? i : Number(i);
        if (selected.includes(key)) selected = selected.filter(x => x !== key);
        else {
          const suit = code.slice(-1);
          selected = selected.filter(x => view.hand[x].slice(-1) === suit);
          if (selected.length < 3) selected.push(key);
        }
        renderTable();
        return;
      }
      if (!d.discard.includes(code)) return;
      const key = i === 'drawn' ? 'drawn' : Number(i);
      if (selected.length === 1 && selected[0] === key) { discard(code); return; }
      selected = [key];
      renderTable();
    }

    // ---------- 动作 ----------
    async function send(payload) {
      if (busy) return;
      busy = true;
      try {
        const r = await api('/api/act', payload);
        selected = [];
        apply(r);
      } catch (e) { toast('操作失败:' + e.message); }
      busy = false;
      run();
    }
    function discard(code) { send({ kind: 'discard', tile: code }); }
    function pressButton(index) { send({ index }); }
    async function passWinThenAct(passIdx, targetKind) {
      if (busy) return;
      busy = true;
      try {
        const r1 = await api('/api/act', { index: passIdx });
        selected = [];
        apply(r1);
        const nextBtns = view?.decision?.buttons || [];
        const follow = nextBtns.find(b => b.kind === targetKind);
        if (follow) {
          const r2 = await api('/api/act', { index: follow.index });
          selected = [];
          apply(r2);
        }
      } catch (e) { toast('操作失败:' + e.message); }
      busy = false;
      run();
    }
    function declareVoid(s) { send({ kind: 'declare_void', suit: s }); }
    function confirmSwap() { if (selected.length === 3) send({ kind: 'swap_three', tiles: selected.map(i => view.hand[i]) }); }
    function pickSwap(labels) {
      const codes = labels.map(fromLabel);
      const used = new Set(); selected = [];
      codes.forEach(c => { const idx = view.hand.findIndex((h, i) => h === c && !used.has(i)); if (idx >= 0) { used.add(idx); selected.push(idx); } });
      renderTable();
    }
    function toggleFast() { fastForward = !fastForward; renderTable(); run(); }

    function showDiscardPop(e) {
      if (!e.tile || fastForward) return;
      document.querySelectorAll('.discard-pop').forEach(x => x.remove());
      const stage = document.querySelector('.stage');
      if (!stage) return;
      const dur = Math.max(900, Math.min(2600, Math.round(delay * 0.90)));
      const el = document.createElement('div');
      el.className = `discard-pop s-${e.seat}`;
      el.style.setProperty('--pop-dur', dur + 'ms');
      const who = ['自己', '下家', '对家', '上家'][e.seat] || '';
      const cnTile = e.tile.slice(0, -1) + (SUIT_CN[e.tile.slice(-1)] || '');
      el.innerHTML = `<div class="who-lbl">${esc(who)} 打出 ${esc(cnTile)}</div>${tileHtml(e.tile)}`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), dur + 50);
    }
    function showCallout(e) {
      if (fastForward) return;
      document.querySelectorAll('.callout').forEach(x => x.remove());
      const stage = document.querySelector('.stage');
      if (!stage) return;
      const isPong = e.kind === 'pong';
      const el = document.createElement('div');
      el.className = `callout ${isPong ? 'pong' : 'kong'} s-${e.seat}`;
      const who = ['自己', '下家', '对家', '上家'][e.seat] || '';
      const word = isPong ? '碰!' : (e.text && e.text.includes('暗杠') ? '暗杠!' : (e.text && e.text.includes('补杠') ? '补杠!' : '杠!'));
      const tilePart = e.tile ? tileHtml(e.tile) : '';
      el.innerHTML = `<span class="word">${word}</span><div><div class="sub">${esc(who)}</div></div>${tilePart}`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    function apply(r) {
      const prev = view;
      view = r.view;
      freshSeats = new Set();
      if (!prev || prev.hand_no !== view.hand_no) {
        selected = [];
        fastForward = false;
        lastDiscardSeat = null;
      }
      const evs = r.events || [];
      for (const e of evs) {
        if (e.kind === 'discard') {
          freshSeats.add(e.seat);
          lastDiscardSeat = e.seat;
        } else if (e.kind === 'pong' || e.kind === 'kong') {
          lastDiscardSeat = null;
        }
      }
      renderAll();
      for (const e of evs) {
        if (e.kind === 'discard') showDiscardPop(e);
        else if (e.kind === 'pong' || e.kind === 'kong') showCallout(e);
        else if (['win', 'self_win', 'rob_kong_win'].includes(e.kind)) burst(e);
      }
      if (view.finished && (!prev || !prev.finished)) setTimeout(showResult, evs.some(e => e.kind.includes('win')) ? 1600 : 450);
    }
    function burst(e) {
      const el = document.createElement('div');
      el.className = 'burst';
      const word = { win: '胡', self_win: '自摸', rob_kong_win: '抢杠胡' }[e.kind];
      el.innerHTML = `${word}<small>${esc(['自己', '下家', '对家', '上家'][e.seat])}</small>`;
      document.querySelector('.stage').appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }

    function togglePause() {
      paused = !paused;
      const btn = document.getElementById('pauseBtn');
      const stepBtn = document.getElementById('stepBtn');
      if (btn) {
        btn.classList.toggle('paused', paused);
        btn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
      }
      if (stepBtn) stepBtn.style.display = paused ? 'inline-block' : 'none';
      if (!paused) run();
    }

    async function stepOnce() {
      if (busy || !view || view.finished || view.decision) return;
      busy = true;
      try {
        const r = await api('/api/advance', {});
        apply(r);
      } catch (e) { toast('出错了:' + e.message); }
      busy = false;
    }

    function setDelay(ms) {
      delay = Math.max(500, Math.min(4000, Math.round(Number(ms) / 100) * 100));
      try { localStorage.setItem('mj.delay.v3', String(delay)); } catch (e) { }
      const rng = document.getElementById('speedRange');
      const lbl = document.getElementById('speedVal');
      if (rng) rng.value = String(delay);
      if (lbl) lbl.textContent = (delay / 1000).toFixed(1) + 's';
      document.querySelectorAll('#speed button').forEach(x => x.classList.toggle('on', Number(x.dataset.v) === delay));
    }

    async function run() {
      if (busy || paused) return;
      busy = true;
      try {
        while (view && !view.finished && !view.decision && !paused) {
          const r = await api('/api/advance', {});
          const evs = r.events || [];
          const visible = evs.length > 0;
          apply(r);
          if (visible && !fastForward) {
            let waitMs = delay;
            if (evs.some(e => ['win', 'self_win', 'rob_kong_win'].includes(e.kind))) waitMs = Math.max(delay + 750, 1750);
            else if (evs.some(e => e.kind === 'pong' || e.kind === 'kong')) waitMs = Math.max(delay + 450, 1450);
            else if (evs.some(e => e.kind === 'swap_three' || e.kind === 'declare_void')) waitMs = Math.round(delay * 0.65);
            await sleep(waitMs);
          }
        }
      } catch (e) { toast('出错了:' + e.message); }
      busy = false;
    }

    // ---------- 顶栏 ----------
    function renderTop() {
      const v = view;
      document.getElementById('topinfo').innerHTML =
        `<span>第 <b>${v.hand_no}</b> 局</span><span>对手 <b>${esc(v.ai_name)}</b></span><span>规则 <b>自摸${v.rules.self_draw_mode === 'add_fan' ? '加番' : '加底'} · ${v.rules.max_fan}番封顶</b></span>` +
        (v.dice ? `<span>骰子 <b>${v.dice.join(' + ')}</b> · 换牌给${esc(swapTarget())}</span>` : '');
      document.getElementById('scoreboard').innerHTML = v.seats.map(s =>
        `<span class="scorechip ${s.seat === 0 ? 'me' : ''}">${esc(s.name)} <b class="${cls(s.total)}">${signed(s.total)}</b></span>`).join('');
    }

    // ---------- 辅助栏 ----------
    const TIER = { 1: ['确定', 't1'], 2: ['计数', 't2'], 3: ['概率', 't3'] };
    function finding(f) {
      const [name, c] = TIER[f.tier];
      const basis = f.basis && f.basis.length ? `<details><summary>依据(${f.basis.length})</summary><ul>${f.basis.map(b => `<li>${esc(b)}</li>`).join('')}</ul></details>` : '';
      const assume = f.assumption ? `<div class="assume">假设:${esc(f.assumption)}</div>` : '';
      return `<div class="finding"><span class="tier ${c}">${name}</span>${esc(f.title)}${basis}${assume}</div>`;
    }
    function findingsBlock(list, collapsed) {
      if (!list || !list.length) return '';
      if (!collapsed) return list.map(finding).join('');
      return `<details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">${esc(collapsed)}(${list.length})</summary>${list.map(finding).join('')}</details>`;
    }
    function card(num, title, body, hint = '', open = true) {
      return `<details class="card" ${open ? 'open' : ''} data-card="${num}"><summary><span class="num">${num}</span>${esc(title)}<span class="hint">${esc(hint)}</span></summary><div class="body">${body}</div></details>`;
    }
    function renderDecisionHero(rep) {
      const d = view.decision;
      if (!d) return `<div class="decision-hero"><div class="eyebrow">当前状态</div><h3>等待牌局推进</h3><div class="reason">AI 正在行动，辅助信息会在需要你决策时更新。</div></div>`;
      if (d.swap && rep.opening_info && rep.opening_info.swap_options?.length) {
        const info = rep.opening_info;
        const o = info.swap_options[0];
        const targetTxt = info.swap_target ? `换给${info.swap_target}${info.swap_target_is_dealer ? '(庄)' : ''} · ` : '';
        const reasonTxt = info.swap_conflict_text || `${targetTxt}送${o.gift_shape || '散牌'}，综合进牌概率与定缺退路最优`;
        const extraQuick = o.exp_flush_rate >= 0.15
          ? `<div class="quick-action"><b>${pct(o.exp_flush_rate)}</b>清一色苗</div>`
          : `<div class="quick-action"><b>${o.gift_shape || (o.suit_left + '张')}</b>${o.gift_shape ? '送牌评估' : '该门余牌'}</div>`;
        return `<div class="decision-hero"><div class="eyebrow">第一优先 · 换三张</div><h3>建议换出 ${minisL(o.tiles)}</h3><div class="reason">${esc(reasonTxt)}</div><div class="quick-actions"><div class="quick-action"><b>${o.exp_shanten ?? o.shanten_rest}</b>${o.exp_shanten !== undefined ? '预计向听' : '留牌向听'}</div><div class="quick-action"><b>${o.exp_void_cnt !== undefined ? o.exp_void_cnt + '张' : o.suit_left}</b>${o.exp_void_cnt !== undefined ? '预计缺门' : '该门余牌'}</div>${extraQuick}</div></div>`;
      }
      if (d.void?.length && rep.opening_info?.void_v3_options?.length) {
        const o = rep.opening_info.void_v3_options[0];
        const note = o.ctx_note ? `${o.ctx_note} · ` : '';
        return `<div class="decision-hero"><div class="eyebrow">第一优先 · 定缺 (void_v3)</div><h3>建议定缺 ${esc(o.suit)}</h3><div class="reason">${esc(note + (rep.opening_info.void_v3_criterion || '综合向听、有效进张与换牌流向'))}</div><div class="quick-actions"><div class="quick-action"><b>${o.void_cnt}</b>手里张数</div><div class="quick-action"><b>${o.shanten}</b>其余牌向听</div><div class="quick-action"><b>${o.live}</b>有效进张</div></div></div>`;
      }
      if (d.void?.length && rep.opening_info?.void_options?.length) {
        const o = rep.opening_info.void_options.slice().sort((a, b) => a.shanten_without - b.shanten_without || a.count - b.count)[0];
        return `<div class="decision-hero"><div class="eyebrow">第一优先 · 定缺</div><h3>建议定缺 ${esc(SUIT_CN[o.suit] || o.suit)}</h3><div class="reason">${esc(rep.opening_info.void_criterion || '优先选择最容易清理的花色')}</div><div class="quick-actions"><div class="quick-action"><b>${o.count}</b>手里张数</div><div class="quick-action"><b>${o.shanten_without}</b>其余牌向听</div></div></div>`;
      }
      const alerts = rep.sections?.alerts || [];
      const winAlert = alerts.find(f => f.title.startsWith('可以自摸') || f.title.startsWith('可以胡') || f.title.startsWith('可以抢杠胡'));
      const passWinAlert = alerts.find(f => f.data && f.data.pass_win_advice);
      if (winAlert) {
        if (passWinAlert && passWinAlert.data.pass_win_advice.verdict === '建议弃0番搏大') {
          const adv = passWinAlert.data.pass_win_advice;
          return `<div class="decision-hero"><div class="eyebrow">第一优先 · 攻守抉择（0番可胡）</div><h3><span style="color:#b45309">⚖ 建议弃0番搏大</span></h3><div class="reason">${esc(adv.summary)}</div><div class="quick-actions"><div class="quick-action"><b>${esc(winAlert.title)}</b>若求稳可直接胡</div></div></div>`;
        }
        const extra = passWinAlert ? `<div style="margin-top:6px;font-size:12px;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 8px">💡 ${esc(passWinAlert.data.pass_win_advice.summary)}</div>` : '';
        return `<div class="decision-hero"><div class="eyebrow">第一优先 · 胡牌</div><h3>${esc(winAlert.title)}</h3><div class="reason">${esc((winAlert.basis || []).join(' · ') || '满足胡牌条件')}</div>${extra}</div>`;
      }

      // 优先提取所有碰/杠参谋, 并按「推荐杠 > 推荐碰 > 弃牌 > 建议过」排序, 彻底避免“建议不碰”盖掉“建议明杠/暗杠”!
      const DO_KONG = new Set(['建议明杠', '建议暗杠', '建议补杠']);
      const DO_PONG = new Set(['强烈建议碰', '建议碰', '可碰']);
      const SKIP_VERDICTS = new Set(['建议不碰', '不建议碰', '慎碰', '建议不杠', '慎杠', '建议不补杠', '慎补杠']);
      const parseTact = f => {
        const m = f.title.match(/^(碰|明杠|暗杠|补杠)([^\[]+)\[([^\]]+)\]:?(.*)$/);
        return m ? { f, actType: m[1], tileLbl: m[2].trim(), verdict: m[3], detail: m[4] } : null;
      };
      const tactList = alerts.map(parseTact).filter(Boolean);
      const bestKong = tactList.find(t => t.actType !== '碰' && DO_KONG.has(t.verdict));
      const bestPong = tactList.find(t => t.actType === '碰' && DO_PONG.has(t.verdict));
      const renderTactHero = t => {
        const isDo = DO_KONG.has(t.verdict) || DO_PONG.has(t.verdict);
        const isSkip = SKIP_VERDICTS.has(t.verdict);
        const dm = t.detail.match(/碰后打([1-9][万条筒])/);
        let headHtml = '';
        if (isDo) {
          headHtml = `<span style="color:#15803d">✔ 建议${esc(t.actType)}</span> ${miniL(t.tileLbl)}` +
            (dm ? ` <span style="font-size:15px;color:#5a4a2e">→ 打</span> ${miniL(dm[1])}` : '');
        } else if (isSkip) {
          headHtml = `<span style="color:#b45309">✖ 建议过</span> <span style="font-size:14px;font-weight:600;color:#6e5a39">（${esc(t.verdict)} ${esc(t.tileLbl)}）</span>`;
        } else {
          headHtml = `<span style="color:#7c3aed">⚖ 权衡（偏过）</span> <span style="font-size:14px;font-weight:600;color:#6e5a39">${esc(t.actType)} ${esc(t.tileLbl)}</span>`;
        }
        const b0 = (t.f.basis || [])[0] || '';
        const b1 = (t.f.basis || [])[1] || '';
        const b2 = (t.f.basis || [])[2] || '';
        return `<div class="decision-hero"><div class="eyebrow">第一优先 · 碰/杠参谋</div><h3>${headHtml}</h3><div class="reason">${esc(b0)}</div><div class="quick-actions"><div class="quick-action" style="text-align:left;padding:6px 8px"><b>${esc(b1 || t.detail)}</b></div>${b2 ? `<div class="quick-action secondary" style="text-align:left;padding:6px 8px"><b>${esc(b2)}</b></div>` : ''}</div></div>`;
      };

      // 1) 有推荐执行的杠(明杠/暗杠/补杠)时, 最高优先展示(优先于碰与弃牌)
      if (bestKong) return renderTactHero(bestKong);
      // 2) 响应别家弃牌且有推荐执行的碰时, 优先展示碰
      if (bestPong) return renderTactHero(bestPong);

      const info = rep.own_info;
      const evList = info?.mode === 'discard' ? (info.discard_v2_options?.length ? info.discard_v2_options : info.candidates) : null;
      const top = evList ? evList[0] : null;
      if (top) {
        const alternatives = (evList || []).slice(1, 3);
        const endgameAlert = alerts.find(f => f.title.startsWith('残局'));
        const reasonTxt = top.ev_reason
          ? `${top.ev_reason}${rep.flags?.defense_conflict ? ` · 攻防:求快${rep.flags.defense_conflict.speed}/求稳${rep.flags.defense_conflict.safe}` : ''}${endgameAlert ? ' · ' + endgameAlert.title : ''}`
          : (rep.flags?.conflict ? `求快打 ${rep.flags.conflict.speed}，求番大打 ${rep.flags.conflict.fan}` : '综合进张效率、真实余牌与安全度');
        const riskTxt = top.safe_all ? '100%安全' : (top.dealin_prob !== undefined ? `${(top.dealin_prob * 100).toFixed(1)}%` : '—');
        return `<div class="decision-hero"><div class="eyebrow">第一优先 · 综合出牌 (discard_v2)</div><h3>建议打出 ${miniL(top.tile)}</h3><div class="reason">${esc(reasonTxt)}</div><div class="quick-actions"><div class="quick-action"><b>${top.shanten_after}</b>向听</div><div class="quick-action"><b>${top.live}</b>张有效牌</div><div class="quick-action"><b>${riskTxt}</b>点炮风险</div>${alternatives.map(a => `<div class="quick-action secondary"><b>${miniL(a.tile)}</b>备选</div>`).join('')}</div></div>`;
      }
      if (tactList.length) {
        return renderTactHero(tactList[0]);
      }
      return `<div class="decision-hero"><div class="eyebrow">当前决策</div><h3>请查看下方提示</h3><div class="reason">先处理确定性提醒，再展开详细分析。</div></div>`;
    }

    function renderAlerts(rep) {
      const list = rep.sections.alerts || [];
      return card('①', '规则提醒', list.length ? list.map(finding).join('') : '<div class="empty">暂无需要提醒的规则</div>');
    }
    function renderOwn(rep) {
      const info = rep.own_info;
      if (!info) return '';
      let body;
      if (info.mode === 'discard') {
        const flags = [];
        if (rep.flags.tie && rep.flags.tie.length) flags.push(`<span class="flag">并列:${rep.flags.tie.map(esc).join('、')}</span>`);
        if (rep.flags.conflict) flags.push(`<span class="flag">求快打${esc(rep.flags.conflict.speed)},求番大打${esc(rep.flags.conflict.fan)}</span>`);
        if (rep.flags.defense_conflict) flags.push(`<span class="flag">攻防:求快打${esc(rep.flags.defense_conflict.speed)},求稳打${esc(rep.flags.defense_conflict.safe)}</span>`);
        const displayList = (info.discard_v2_options && info.discard_v2_options.length) ? info.discard_v2_options : info.candidates;
        const rows = displayList.map(c => `<tr data-row-tile="${fromLabel(c.tile)}" title="${esc(c.ev_reason || '')}"><td>${miniL(c.tile)}</td><td>${c.shanten_after}</td><td>${c.useful_kinds}种 <b>${c.live}</b>张${c.wall_expected_live !== undefined ? `<br><small class="muted">墙≈${c.wall_expected_live.toFixed(1)}</small>` : ''}</td>
      <td>${c.max_fan === null ? '—' : c.max_fan + '番' + (c.dead_wait ? ' <span class="err">死听</span>' : '')}</td>
      <td class="${c.safe_all ? 'safe' : (c.dealin_prob >= 0.12 ? 'err' : 'p3')}">${c.safe_all ? '安全' : (c.dealin_prob !== undefined ? (c.dealin_prob * 100).toFixed(1) + '%' : '—')}</td>
      <td class="p3"><b>${c.ev_score !== undefined ? c.ev_score.toFixed(2) : '—'}</b></td>
      <td class="p3">${pct(c.p_next)}</td></tr>`).join('');
        body = `<div class="criterion">排序:${esc(info.criterion_ev || info.criterion)}</div>${flags.join('')}
      <table class="t"><thead><tr><th>打出</th><th>向听</th><th>进张</th><th>最大番</th><th><span class="tier t3">风险</span>点炮</th><th><span class="tier t3">综合</span>EV</th><th><span class="tier t3">概率</span>下摸</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="criterion" style="margin-top:6px">按求番大:${(info.order_by_fan || []).slice(0, 6).map(esc).join(' › ')}</div>`;
      } else {
        const useful = (info.useful || []).map(u => `${miniL(u.tile)}<small class="muted">${u.remaining}</small>`).join(' ');
        body = `<div>向听 <b>${info.shanten}</b> · 有效进张剩 <b>${info.live}</b> 张</div><div style="margin:4px 0">${useful || '<span class="muted">无</span>'}</div>`;
        if (info.waits && info.waits.length) {
          body += `<table class="t"><thead><tr><th>听</th><th>剩</th><th>番</th><th>点炮得</th><th>自摸每家</th></tr></thead><tbody>${info.waits.map(w => `<tr><td>${miniL(w.tile)}</td><td>${w.remaining}</td><td>${w.fan}</td><td>${w.ron_score}</td><td>${w.tsumo_each}</td></tr>`).join('')}</tbody></table>`;
        }
      }
      return card('②', '自己的牌', body + findingsBlock(rep.sections.own_hand, '全部结论'), info.mode === 'discard' ? '鼠标停在手牌上会高亮对应行' : '');
    }
    function renderDanger(rep) {
      const rows = rep.danger_rows || [];
      if (!rows.length) return card('③', '安全度与读牌', '<div class="empty">场上没有在场对手需要防守</div>');
      const reads = rep.opponent_reads || [];
      const readBar = reads.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${reads.map(r => {
        const threat = r.threats && r.threats.length ? ` · <span class="err">${esc(r.threats.join('/'))}</span>` : '';
        return `<span class="flag" title="${esc((r.basis || []).join('；'))}"><b>${esc(r.name)}</b> 听≈${pct(r.tenpai_prob)}${threat}</span>`;
      }).join('')}</div>` : '';
      const enums = rep.endgame_enums || [];
      const enumBar = enums.length ? enums.map(em => {
        const fl = em.flush_suit_label ? ` · <b>清${esc(em.flush_suit_label)}概率≈${Math.round(em.flush_prob * 100)}%</b>` : '';
        const tw = (em.top_waits || []).slice(0, 5).map(w => `${esc(w.tile)}(${Math.round(w.dealin_prob * 100)}%)`).join('、');
        return `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:6px 8px;margin-bottom:8px;font-size:12px;color:#7f1d1d"><div>🎯 <b>${esc(em.name)}残局精确枚举</b>（余${em.hidden_count}暗 · ${em.tenpai_hand_count}听型${fl}）</div><div style="color:#475569;font-size:11px;margin-top:2px">${esc(em.supply_note)}</div>${tw ? `<div style="margin-top:2px;font-size:11px">最危听口：<b>${tw}</b></div>` : ''}</div>`;
      }).join('') : '';
      const names = rows[0].per_opponent.map(e => e.name);
      const body = rows.map(r => `<tr data-row-tile="${fromLabel(r.tile)}"><td>${miniL(r.tile)}</td>${r.per_opponent.map(e => {
        if (e.safe) return `<td class="safe" title="${e.reason === 'void' ? '对方定缺这门' : e.reason === 'holds_void' ? '他还拿着你换给他的缺门牌,打出之前不能胡' : '所有等待形状都被堵死'}">100%安全</td>`;
        const possible = e.shapes.filter(s => s.possible);
        const tags = (e.risk_tags && e.risk_tags.length) ? '\n读牌:' + e.risk_tags.join('、') : '';
        const tip = possible.map(s => `${s.name}(${s.tiles.join('、')})${s.hold_prob !== undefined ? ' 约' + pct(s.hold_prob) : ''}`).join('\n') + tags;
        const dp = e.dealin_prob !== undefined ? `<b class="${e.dealin_prob >= 0.12 ? 'err' : 'p3'}">${(e.dealin_prob * 100).toFixed(1)}%</b>` : `<span class="p3">≈${pct(e.any_shape_prob || 0)}</span>`;
        return `<td title="${esc(tip)}">${dp} <small class="muted">(${possible.length}形)</small></td>`;
      }).join('')}</tr>`).join('');
      const certain = (rep.sections.danger || []).filter(f => f.tier === 1);
      const rest = (rep.sections.danger || []).filter(f => f.tier !== 1);
      return card('③', '安全度与读牌', `${readBar}${enumBar}<table class="t"><thead><tr><th>你的牌</th>${names.map(n => `<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
    <div class="assume">百分比为大样本标定的单家点炮风险(结合听牌进度、现物/双筋、清一色偏向与换牌搭子);100%安全为零误判。</div>
    ${findingsBlock(certain, '确定结论')}${findingsBlock(rest, '计数与概率结论')}`, '停在格子上看形状与读牌');
    }
    function renderWinners(rep) {
      const items = rep.winners || [];
      if (!items.length) return '';
      const cards = items.map(w => {
        const sureBanner = (w.certain_tiles && w.certain_tiles.length)
          ? `<div style="margin:4px 0;color:#0369a1;font-weight:700;font-size:12px">100% 必有: ${w.certain_tiles.map(c => `${miniL(c.tile)}${c.count > 1 ? '×' + c.count : ''}`).join(' ')}</div>`
          : '';
        let extra = '';
        if (w.status === 'complete') {
          extra = `<div>可能组合 <b>${w.candidate_count}</b> 种${w.joint ? '(已与另一名胡牌者联合约束)' : ''}</div>
        <details><summary class="muted" style="cursor:pointer;font-size:12px">按权重列出前 ${w.candidates.length} 种</summary><table class="t"><tbody>${w.candidates.map(c => `<tr><td>${esc(c.hand)}</td><td class="p3">${pct(c.weight)}</td></tr>`).join('')}</tbody></table></details>`;
          if (w.hold_prob) extra += `<div class="p3" style="font-size:12px">${w.hold_prob.map(h => `有${esc(h.tile)} ${pct(h.prob)}`).join(' · ')}</div>`;
        } else if (w.status === 'too_many') extra = '<div class="muted">可能组合太多,暂不展开(余牌少了会自动展开)</div>';
        else if (w.status === 'no_candidate') extra = '<div class="err">找不到能胡的组合,牌面信息可能有误</div>';
        else extra = '<div class="muted">胡牌张未亮出,无法反推</div>';
        return `<div class="winner-card"><b>${esc(w.name)}</b> ${esc(w.how)} ${w.tile ? miniL(w.tile) : ''} · 扣着 ${w.hidden_count} 张${sureBanner}${extra}</div>`;
      }).join('');
      return card('④', '已胡者手牌反推', cards + findingsBlock(rep.sections.winners, '全部结论'));
    }
    function renderRemaining(rep) {
      const rows = rep.remaining || [];
      if (!rows.length) return '';
      let g = '<div class="rem-grid">';
      ['W', 'T', 'B'].forEach((s, si) => {
        for (let r = 0; r < 9; r++) {
          const row = rows[si * 9 + r];
          const code = `${r + 1}${s}`;
          const eff = row.effective_unseen !== undefined ? row.effective_unseen : row.unseen;
          const locked = Number(row.certain_locked) || 0;
          const gone = eff === 0;
          const lbl = row.unseen === 0 ? '绝' : (eff === 0 ? '锁绝' : String(eff));
          const tip = `${r + 1}${SUIT_CN[s]} · 已现:${row.seen_from || '无'}${locked ? ` · 已胡100%锁死 ${locked} 张` : ''}`;
          g += `<div class="rem-cell ${gone ? 'zero' : eff === 1 ? 'last' : ''}">${tileHtml(code, 'mini', `title="${esc(tip)}"`)}<b>${lbl}</b><span>${gone ? (locked ? '必扣' + locked : '') : '≈' + Number(row.wall_expected).toFixed(1)}</span></div>`;
        }
      });
      g += '</div>';
      return card('⑤', '余牌', g + `<div style="margin-top:6px">${findingsBlock(rep.sections.remaining || [], '相关结论')}</div>`, '大字=实际剩余(已扣已胡必有) · ≈=估计在牌墙', true);
    }
    function renderOpening(rep) {
      const info = rep.opening_info;
      const list = rep.sections.opening || [];
      if (!info && !list.length) return '';
      let body = '';
      if (info && info.swap_options && view.decision && view.decision.swap) {
        const flagHtml = info.swap_conflict_text ? `<div><span class="flag">${esc(info.swap_conflict_text)}</span></div>` : '';
        body += `<div class="criterion">${esc(info.swap_criterion)}</div>${flagHtml}<table class="t"><thead><tr><th>换出(点击选中)</th><th><span class="tier t3">概率</span>向听</th><th><span class="tier t3">概率</span>缺门</th><th>大牌/送牌</th></tr></thead><tbody>${info.swap_options.slice(0, 8).map(o => {
          const flushTag = o.exp_flush_rate >= 0.12 ? `<span class="p3">清${pct(o.exp_flush_rate)}</span> · ` : '';
          const shTxt = o.exp_shanten !== undefined ? o.exp_shanten : o.shanten_rest;
          const vdTxt = o.exp_void_cnt !== undefined ? `${o.exp_void_cnt}张` : `余${o.suit_left}`;
          return `<tr class="clickable" onclick='pickSwap(${JSON.stringify(o.tiles)})'><td>${minisL(o.tiles)}</td><td>${shTxt}</td><td>${vdTxt}</td><td>${flushTag}${esc(o.gift_shape || '')}</td></tr>`;
        }).join('')}</tbody></table>`;
      }
      if (info && info.void_v3_options) {
        const canVoid = Boolean(view.decision && view.decision.void && view.decision.void.length);
        body += `<div class="criterion" style="margin-top:8px">定缺(void_v3${canVoid ? ' · 点击行直接定缺' : ''}):${esc(info.void_v3_criterion || '')}</div><table class="t"><thead><tr><th>缺</th><th>张数</th><th>向听</th><th>有效进张</th><th>流向备注</th></tr></thead><tbody>${info.void_v3_options.map(o => `<tr${canVoid ? ` class="clickable" onclick="declareVoid('${o.suit_code}')"` : ''}><td><b>${esc(o.suit)}</b></td><td>${o.void_cnt}</td><td>${o.shanten}</td><td><b>${o.live}</b></td><td>${esc(o.ctx_note || '—')}</td></tr>`).join('')}</tbody></table>`;
      } else if (info && info.void_options) {
        body += `<div class="criterion" style="margin-top:8px">定缺:${esc(info.void_criterion)}</div><table class="t"><thead><tr><th>缺</th><th>这门张数</th><th>其余牌向听</th></tr></thead><tbody>${info.void_options.map(o => `<tr><td>${esc(o.suit)}</td><td>${o.count}</td><td>${o.shanten_without}</td></tr>`).join('')}</tbody></table>`;
      }
      return card(info ? '开' : '换', info ? '开局' : '换牌去向', body + findingsBlock(list));
    }
    function renderAside() {
      const el = document.getElementById('aside');
      const rep = view.report;
      const openState = {};
      el.querySelectorAll('details.card').forEach(d => { openState[d.dataset.card] = d.open; });
      const scroll = el.scrollTop;
      if (view.finished) { el.innerHTML = '<div class="empty">本局已结束。</div>'; return; }
      if (!rep) { el.innerHTML = '<div class="empty">等待其他玩家…</div>'; return; }
      let html = renderDecisionHero(rep);
      if (rep.errors && rep.errors.length) html += card('!', '牌面不守恒', (rep.sections.alerts || []).map(finding).join(''));
      else {
        html += renderAlerts(rep);
        const body = renderOwn(rep) + renderDanger(rep) + renderWinners(rep) + renderRemaining(rep);
        html += rep.opening_info ? renderOpening(rep) + body : body + renderOpening(rep);
      }
      html += `<div class="muted" style="font-size:11px;text-align:right">详细分析 · ${rep.elapsed_ms} ms</div>`;
      el.innerHTML = html;
      el.querySelectorAll('details.card').forEach(d => { if (d.dataset.card in openState) d.open = openState[d.dataset.card]; });
      el.scrollTop = scroll;
    }

    // ---------- 结算 ----------
    function showResult() {
      const v = view;
      const rows = [0, 1, 2, 3].map(i => {
        const s = v.seats[i];
        const hand = (s.hand || []).slice().sort((a, b) => SUIT_ORDER[a.slice(-1)] * 10 + +a.slice(0, -1) - SUIT_ORDER[b.slice(-1)] * 10 - +b.slice(0, -1));
        const melds = s.melds.map(m => `<span class="sep"></span>${tileHtml(m.tile, 'mini').repeat(m.kind === 'kong' ? 4 : 3)}`).join('');
        const win = s.win ? `<span class="sep"></span>${s.win.tile ? tileHtml(s.win.tile, 'mini won-tile') : ''}<span style="margin-left:6px;color:#ff8a70">${esc(s.win.how)}</span>` : '';
        const aiTag = s.ai_tag ? `<small style="color:#ffd36a;margin-left:4px">[${esc(s.ai_tag)}]</small>` : '';
        return `<div class="res-row"><div class="nm">${esc(s.name)}${v.dealer === i ? ' <span class="badge-dealer">庄</span>' : ''}${aiTag}<small>${s.void ? '缺' + SUIT_CN[s.void] : ''}</small></div>
      <div class="res-tiles">${hand.map(c => tileHtml(c, 'mini')).join('')}${melds}${win}</div>
      <div class="delta ${cls(s.score)}">${signed(s.score)}</div><div class="tot">累计 <b class="${cls(s.total)}">${signed(s.total)}</b></div></div>`;
      }).join('');
      const anyWin = v.seats.some(s => s.won);
      document.getElementById('layer').innerHTML = `<div class="overlay"><div class="modal"><h3>${anyWin ? '本局结算' : '流局'}</h3>${rows}
    <div class="foot"><button class="btn-act pass" onclick="closeLayer()">看牌桌</button><button class="btn-act pass" style="border-color:#ff7b5c;color:#ffb4a2" onclick="openMark()">🚩 反馈本局</button><button class="btn-act" onclick="nextHand()">下一局</button></div></div></div>`;
    }
    function closeLayer() {
      document.getElementById('layer').innerHTML = view.finished ? `<div style="position:fixed;right:450px;bottom:30px;z-index:40"><button class="btn-act" onclick="showResult()">结算</button> <button class="btn-act" onclick="nextHand()">下一局</button></div>` : '';
    }
    async function nextHand() {
      document.getElementById('layer').innerHTML = '';
      try { apply(await api('/api/next_hand', {})); } catch (e) { toast(e.message); }
      run();
    }

    // ---------- 实时反馈与标记 ----------
    const MARK_TAGS = ['弃牌不对', '换三张不对', '定缺不对', '碰/杠建议不对', '读牌/点炮估错', '残局弃胡/冲听', '这手很赞'];
    let selectedMarkTag = '弃牌不对';
    function pickMarkTag(btn, tag) {
      selectedMarkTag = tag;
      document.querySelectorAll('.mtag').forEach(el => {
        el.style.background = el === btn ? '#e8c46a' : '#1b2230';
        el.style.color = el === btn ? '#2a1d05' : '#cbd5e1';
        el.style.fontWeight = el === btn ? '700' : '400';
      });
    }
    function openMark() {
      const phaseTag = (view && view.phase === 'swap_three') ? '换三张不对'
        : (view && view.phase === 'declare_void') ? '定缺不对' : '弃牌不对';
      selectedMarkTag = phaseTag;
      const tagsHtml = MARK_TAGS.map(t => {
        const on = t === selectedMarkTag;
        return `<button type="button" class="mtag" onclick="pickMarkTag(this,'${t}')" style="border:1px solid #3a4054;border-radius:14px;padding:4px 10px;margin:0 6px 6px 0;cursor:pointer;font-size:12px;background:${on ? '#e8c46a' : '#1b2230'};color:${on ? '#2a1d05' : '#cbd5e1'};font-weight:${on ? '700' : '400'}">${t}</button>`;
      }).join('');
      document.getElementById('layer').innerHTML = `<div class="overlay"><div class="modal mark-box" style="width:min(580px,94vw)"><h3 style="font-size:22px;margin-bottom:6px">🚩 给辅助器提实时反馈</h3>
    <div class="muted" style="margin-bottom:10px;font-size:12px">会自动保存当前完整牌面、辅助器 EV 推荐、以及后台复盘用的三家暗牌线索（保存在 feedback_inbox.jsonl），随时喊我就能按你的线索升级辅助器。</div>
    <div style="margin-bottom:8px">${tagsHtml}</div>
    <input id="markpecpe="text" placeholder="我认为更好的选择（选填，例如：打5筒 / 不碰9条 / 换123万）" style="width:100%;padding:8px 10px;margin-bottom:8px;border-radius:8px;border:1px solid #3a4054;background:#0f1218;color:#f5efe0;font-size:13px" />
    <textarea id="markNote" placeholder="你的牌理思路或吐槽（选填，例如：下家明显清一色条，这里不该拆两面 / 应该保清一色）"></textarea>
    <div class="foot"><button class="btn-act pass" onclick="document.getElementById('layer').innerHTML='';if(view&&view.finished)closeLayer()">取消</button><button class="btn-act" onclick="saveMark()">保存反馈</button></div></div></div>`;
      setTimeout(() => document.getElementById('markExpected').focus(), 50);
    }
    async function saveMark() {
      const note = document.getElementById('markNote').value;
      const expected_action = document.getElementById('markExpected').value;
      try {
        const r = await api('/api/mark', { tag: selectedMarkTag, expected_action, note });
        toast(`反馈已存入收件箱（累计 ${r.inbox_count || r.count} 条），随时喊我复盘升级`);
      } catch (e) { toast('保存失败:' + e.message); }
      document.getElementById('layer').innerHTML = '';
      if (view.finished) closeLayer();
    }

    function renderAll() { renderTop(); renderTable(); renderAside(); }

    // ---------- 启动 ----------
    document.getElementById('markBtn').addEventListener('click', openMark);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('stepBtn').addEventListener('click', stepOnce);
    document.getElementById('speedRange').addEventListener('input', e => setDelay(e.target.value));
    document.querySelectorAll('#speed button').forEach(b => {
      b.addEventListener('click', () => setDelay(b.dataset.v));
    });
    setDelay(delay);
    (async () => {
      try { apply(await api('/api/state')); run(); }
      catch (e) { document.getElementById('aside').innerHTML = `<div class="err">连接服务失败:${esc(e.message)}</div>`; }
    })();
  </script>
</body>

</html>
