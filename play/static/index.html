<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四川麻将 · 血战到底</title>
  <style>
    :root {
      --bg0: #0d0f14;
      --bg1: #171a22;
      --gold: #e8c46a;
      --gold-hi: #fff1c2;
      --gold-lo: #a07a2c;
      --felt: #1f6b47;
      --felt-dark: #0f3d28;
      --wood: #5a3418;
      --wood-hi: #8b5a2b;
      --ivory: #fffcf2;
      --ivory-lo: #e9dfc6;
      --tile-back: #1b8a5a;
      --tile-back-lo: #0f5c3b;
      --red: #e0533d;
      --green-ok: #3fbf72;
      --panel: #f6f2e8;
      --panel-ink: #2a2620;
      --muted: #8b8476;
      --t1: #2f6fd1;
      --t2: #2e9a57;
      --t3: #c47d12;
      --hand-w: 66px;
      --hand-h: 94px;
      --riv-w: 40px;
      --riv-h: 55px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: radial-gradient(1200px 700px at 30% 20%, #232838 0%, var(--bg0) 70%);
      color: #eee;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: grid;
      grid-template-rows: 54px 1fr;
      height: 100vh;
    }

    /* ---------- 顶栏 ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 20px;
      background: linear-gradient(#1d212c, #12151c);
      border-bottom: 1px solid #2c3140;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }

    .brand {
      font-family: "STKaiti", "KaiTi", "楷体", serif;
      font-size: 26px;
      letter-spacing: 3px;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .2);
    }

    .brand small {
      font-size: 15px;
      letter-spacing: 1px;
      margin-left: 6px;
    }

    .topinfo {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: #c9c3b4;
    }

    .topinfo b {
      color: var(--gold);
      font-weight: 600;
    }

    .spacer {
      flex: 1;
    }

    .scoreboard {
      display: flex;
      gap: 6px;
    }

    .scorechip {
      background: #232838;
      border: 1px solid #343b4f;
      border-radius: 16px;
      padding: 3px 11px;
      font-size: 13px;
    }

    .scorechip.me {
      border-color: var(--gold-lo);
    }

    .pos {
      color: var(--green-ok);
    }

    .neg {
      color: #ff7a66;
    }

    .speed {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #aaa;
    }

    .seg {
      display: flex;
      border: 1px solid #3a4054;
      border-radius: 6px;
      overflow: hidden;
    }

    .seg button {
      background: transparent;
      border: 0;
      color: #bbb;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .seg button.on {
      background: var(--gold);
      color: #2a1d05;
      font-weight: 700;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 0;
    }

    /* ---------- 牌桌 ---------- */
    .stage {
      position: relative;
      padding: 14px;
      min-width: 0;
      min-height: 0;
      display: flex;
    }

    .frame {
      flex: 1;
      border-radius: 26px;
      padding: 16px;
      position: relative;
      background:
        repeating-linear-gradient(95deg, rgba(255, 255, 255, .035) 0 2px, transparent 2px 9px),
        linear-gradient(145deg, var(--wood-hi), var(--wood) 45%, #3c2210);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .65), inset 0 2px 0 rgba(255, 220, 160, .25), inset 0 -3px 6px rgba(0, 0, 0, .5);
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 19px;
      border: 1.5px solid rgba(232, 196, 106, .45);
      pointer-events: none;
    }

    .felt {
      position: relative;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, .10), transparent 60%),
        radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 95%);
      box-shadow: inset 0 0 60px rgba(0, 0, 0, .6), inset 0 0 0 2px rgba(0, 0, 0, .35);
      display: grid;
      grid-template-columns: 150px 1fr 150px;
      grid-template-rows: 128px 1fr 200px;
      grid-template-areas: "top top top" "left center right" "bottom bottom bottom";
    }

    .felt::before {
      /* 绒布纹理 */
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: radial-gradient(rgba(0, 0, 0, .5) 1px, transparent 1px);
      background-size: 3px 3px;
    }

    /* ---------- 牌 ---------- */
    .tile {
      position: relative;
      display: inline-block;
      flex: none;
      width: var(--riv-w);
      height: var(--riv-h);
      border-radius: 5px;
      background: linear-gradient(180deg, var(--ivory) 0%, #f7f0de 70%, var(--ivory-lo) 100%);
      box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 6px 7px rgba(0, 0, 0, .45), inset 0 1px 0 #fff;
      margin: 0 1px 5px 0;
    }

    .tile img {
      position: absolute;
      inset: 9% 10% 8%;
      width: 80%;
      height: 83%;
      object-fit: contain;
      pointer-events: none;
    }

    .tile.back {
      background: linear-gradient(160deg, #2bb377, var(--tile-back) 55%, var(--tile-back-lo));
      box-shadow: 0 2px 0 #d9cfb5, 0 3px 0 #b8ab8a, 0 5px 6px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .35);
    }

    .tile.back::after {
      content: "";
      position: absolute;
      inset: 22% 26%;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, .18);
    }

    .tile.known-tile {
      outline: 2px solid #62d99a;
      outline-offset: 2px;
      box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 0 10px rgba(98, 217, 154, .55);
    }

    .tile.known-tile::after {
      content: "已知";
      position: absolute;
      left: 50%;
      bottom: -15px;
      transform: translateX(-50%);
      color: #9df0ba;
      font-size: 9px;
      white-space: nowrap;
      text-shadow: 0 1px 2px #092718;
    }

    .tile.inferred-tile {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
      box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 0 10px rgba(56, 189, 248, .6);
    }

    .tile.inferred-tile::after {
      content: "推知";
      position: absolute;
      left: 50%;
      bottom: -15px;
      transform: translateX(-50%);
      color: #7dd3fc;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 1px 2px #082f49;
    }

    .tile.side.inferred-tile::after {
      left: auto;
      bottom: auto;
      top: 2px;
      right: 2px;
      transform: none;
      background: rgba(2, 132, 199, .92);
      color: #fff;
      padding: 1px 3px;
      border-radius: 4px;
      font-size: 8px;
      line-height: 1.1;
      text-shadow: none;
    }

    .tile.dim {
      filter: brightness(.86) saturate(.8);
    }

    .tile.latest {
      outline: 2.5px solid #ffd36a;
      outline-offset: 2px;
      z-index: 4;
      animation: glow 1.2s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 0 8px 3px rgba(255, 211, 106, .75);
      }

      50% {
        box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 0 18px 6px rgba(255, 211, 106, 1);
      }
    }

    .tile.fresh {
      animation: dropTop .48s cubic-bezier(.18, .92, .32, 1.2);
    }

    .r-bot .tile.fresh {
      animation: dropBot .48s cubic-bezier(.18, .92, .32, 1.2);
    }

    .r-left .tile.fresh {
      animation: dropLeft .48s cubic-bezier(.18, .92, .32, 1.2);
    }

    .r-right .tile.fresh {
      animation: dropRight .48s cubic-bezier(.18, .92, .32, 1.2);
    }

    @keyframes dropTop {
      from {
        transform: translateY(-34px) scale(1.38);
        opacity: .25;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    @keyframes dropBot {
      from {
        transform: translateY(34px) scale(1.38);
        opacity: .25;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    @keyframes dropLeft {
      from {
        transform: translateX(-34px) scale(1.38);
        opacity: .25;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    @keyframes dropRight {
      from {
        transform: translateX(34px) scale(1.38);
        opacity: .25;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    /* 游戏级出牌大特写浮卡 (雀魂风格) */
    .discard-pop {
      position: absolute;
      z-index: 24;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 14px 12px;
      border-radius: 14px;
      background: rgba(14, 24, 20, .88);
      border: 1.5px solid rgba(232, 196, 106, .75);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .65), 0 0 18px rgba(232, 196, 106, .35);
      animation: popSpot var(--pop-dur, 1050ms) cubic-bezier(.18, .92, .32, 1.15) forwards;
    }

    .discard-pop .who-lbl {
      font-size: 13px;
      font-weight: 700;
      color: #ffd97d;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .discard-pop .tile {
      width: 58px;
      height: 82px;
      border-radius: 7px;
      margin: 0;
      box-shadow: 0 4px 0 var(--tile-back), 0 6px 0 var(--tile-back-lo), 0 10px 16px rgba(0, 0, 0, .55), inset 0 1px 0 #fff;
    }

    .discard-pop.s-0 {
      left: 50%;
      bottom: 215px;
      transform: translateX(-50%);
    }

    .discard-pop.s-1 {
      right: 175px;
      top: 46%;
      transform: translateY(-50%);
    }

    .discard-pop.s-2 {
      left: 50%;
      top: 138px;
      transform: translateX(-50%);
    }

    .discard-pop.s-3 {
      left: 175px;
      top: 46%;
      transform: translateY(-50%);
    }

    @keyframes popSpot {
      0% {
        opacity: 0;
        scale: .62;
      }

      16% {
        opacity: 1;
        scale: 1.08;
      }

      28% {
        opacity: 1;
        scale: 1;
      }

      78% {
        opacity: 1;
        scale: 1;
      }

      100% {
        opacity: 0;
        scale: .92;
      }
    }

    /* 碰 / 杠 喊牌特效 */
    .callout {
      position: absolute;
      z-index: 26;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(12, 18, 28, .92);
      border: 2px solid #ffd36a;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .7), 0 0 24px rgba(255, 211, 106, .45);
      animation: calloutPop 1.35s cubic-bezier(.18, .92, .32, 1.18) forwards;
      white-space: nowrap;
    }

    .callout.pong {
      border-color: #38bdf8;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .7), 0 0 24px rgba(56, 189, 248, .5);
    }

    .callout.kong {
      border-color: #c084fc;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .7), 0 0 24px rgba(192, 132, 252, .55);
    }

    .callout .word {
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff2c2;
      text-shadow: 0 3px 8px rgba(0, 0, 0, .8);
    }

    .callout.pong .word {
      color: #7dd3fc;
    }

    .callout.kong .word {
      color: #e9d5ff;
    }

    .callout .sub {
      font-size: 13px;
      color: #e2e8f0;
      font-weight: 700;
    }

    .callout .tile {
      width: 40px;
      height: 56px;
      margin: 0;
    }

    .callout.s-0 {
      left: 50%;
      bottom: 230px;
      transform: translateX(-50%);
    }

    .callout.s-1 {
      right: 165px;
      top: 44%;
      transform: translateY(-50%);
    }

    .callout.s-2 {
      left: 50%;
      top: 135px;
      transform: translateX(-50%);
    }

    .callout.s-3 {
      left: 165px;
      top: 44%;
      transform: translateY(-50%);
    }

    @keyframes calloutPop {
      0% {
        opacity: 0;
        scale: .45;
      }

      18% {
        opacity: 1;
        scale: 1.12;
      }

      30% {
        opacity: 1;
        scale: 1;
      }

      78% {
        opacity: 1;
        scale: 1;
      }

      100% {
        opacity: 0;
        scale: .94;
      }
    }

    .pause-btn {
      background: #1f2636;
      color: #e6d8b3;
      border: 1px solid #3a4054;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .pause-btn:hover {
      border-color: var(--gold);
    }

    .pause-btn.paused {
      background: #854d0e;
      border-color: var(--gold);
      color: #fef3c7;
    }

    .tile.won-tile {
      box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 0 12px 4px rgba(255, 90, 60, .75);
    }

    .tile.hand {
      width: var(--hand-w);
      height: var(--hand-h);
      border-radius: 7px;
      margin: 0 2px 8px 0;
      cursor: default;
      transition: transform .12s, filter .12s;
    }

    .tile.hand.can {
      cursor: pointer;
    }

    .tile.hand.can:hover {
      transform: translateY(-8px);
    }

    .tile.hand.sel {
      transform: translateY(-18px);
      filter: drop-shadow(0 0 8px rgba(232, 196, 106, .95));
    }

    .tile.hand.void-suit::before {
      content: "缺";
      position: absolute;
      top: -9px;
      right: -5px;
      z-index: 2;
      font-size: 11px;
      line-height: 1;
      padding: 3px 4px;
      background: var(--red);
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }

    .tile.hand.tenpai-can::after {
      content: "听";
      position: absolute;
      top: -9px;
      left: -5px;
      z-index: 2;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      padding: 3px 4px;
      background: linear-gradient(180deg, #34d399, #059669);
      color: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
    }

    .tile.hand.hint {
      box-shadow: 0 3px 0 var(--tile-back), 0 4px 0 var(--tile-back-lo), 0 0 0 3px var(--gold), 0 6px 7px rgba(0, 0, 0, .45);
    }

    .tile.mini {
      --riv-w: 22px;
      --riv-h: 30px;
      border-radius: 4px;
      margin-bottom: 4px;
      box-shadow: 0 2px 0 var(--tile-back), 0 3px 4px rgba(0, 0, 0, .35), inset 0 1px 0 #fff;
      vertical-align: middle;
    }

    .tile.meld {
      --riv-w: 40px;
      --riv-h: 55px;
    }

    /* 横放的牌(左右两家):外框横过来,牌面转 90 度 */
    .tile.side {
      width: var(--riv-h);
      height: var(--riv-w);
      margin: 0 0 4px 0;
    }

    .tile.side img {
      inset: auto;
      left: 50%;
      top: 50%;
      width: calc(var(--riv-w) * .8);
      height: calc(var(--riv-h) * .83);
      transform: translate(-50%, -50%) rotate(var(--rot, 90deg));
    }

    .tile.side.back {
      --riv-w: 28px;
      --riv-h: 46px;
      margin-bottom: -1px;
    }

    /* ---------- 四家区域 ---------- */
    .zone {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .z-top {
      grid-area: top;
      flex-direction: column;
      gap: 6px;
    }

    .z-left {
      grid-area: left;
      flex-direction: row;
      gap: 8px;
    }

    .z-right {
      grid-area: right;
      flex-direction: row-reverse;
      gap: 8px;
    }

    .z-bottom {
      grid-area: bottom;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    .backs-row {
      display: flex;
      align-items: flex-end;
    }

    .backs-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .melds {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .melds.col {
      flex-direction: column;
      gap: 6px;
    }

    .meld {
      display: flex;
    }

    .meld.col {
      flex-direction: column;
    }

    .plate {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 6px;
      z-index: 3;
      background: linear-gradient(180deg, rgba(20, 22, 30, .92), rgba(10, 12, 18, .92));
      border: 1px solid rgba(232, 196, 106, .35);
      border-radius: 32px;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .5);
      color: #ddd;
      white-space: nowrap;
    }

    .plate.active {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(232, 196, 106, .35), 0 0 22px rgba(232, 196, 106, .55);
    }

    .plate.won {
      border-color: #ff8a70;
      box-shadow: 0 0 0 1px rgba(255, 138, 112, .5), 0 4px 14px rgba(0, 0, 0, .55);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 19px;
      background: radial-gradient(circle at 35% 30%, #4b5470, #1f2433);
      border: 3px solid var(--gold-lo);
      color: var(--gold-hi);
    }

    .plate.void-W .avatar {
      border-color: #e0533d;
    }

    .plate.void-T .avatar {
      border-color: #38b265;
    }

    .plate.void-B .avatar {
      border-color: #4a86e8;
    }

    .plate .info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .plate .who {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      line-height: 1;
      color: #fff;
      font-weight: 600;
    }

    .void-chip {
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 1px 3px rgba(0, 0, 0, .5);
    }

    .void-chip.W {
      background: linear-gradient(#e45a43, #b5301f);
    }

    .void-chip.T {
      background: linear-gradient(#3fb86b, #1f7f42);
    }

    .void-chip.B {
      background: linear-gradient(#4f8cec, #2556a8);
    }

    .void-chip.none {
      background: #444a5a;
      color: #b9bdc9;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      box-shadow: none;
    }

    .badge-dealer {
      background: linear-gradient(var(--gold-hi), var(--gold));
      color: #4a2f00;
      border-radius: 4px;
      padding: 1px 4px;
      font-weight: 800;
      font-size: 11px;
    }

    .score-box {
      min-width: 38px;
      margin-left: 2px;
      padding-left: 10px;
      border-left: 1px solid rgba(255, 255, 255, .14);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .score-box .score {
      font-size: 24px;
      line-height: 1;
      font-weight: 800;
      color: var(--gold-hi);
    }

    .score-box .score.pos {
      color: #5fe08f;
    }

    .score-box .score.neg {
      color: #ff7a66;
    }

    .score-box small {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1;
      color: #a9adb9;
    }

    .won-tag {
      position: absolute;
      top: -12px;
      right: 12px;
      padding: 1px 8px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
      background: linear-gradient(#e2533c, #a8261a);

      border-radius: 9px;

    .p-top {
      top: 10px;

    }

    .p-left {

      top: 10px;

    .p-right {

      top: 10px;

    /* ---------- 中央 ---------- */
    .center {
      grid-area: center;
      position: relative;
      display: grid;
      min-height: 0;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: 1fr auto 1fr;
      grid-template-areas: ". rtop ." "rleft compass rright" ". rbot .";
      gap: 8px;
      padding: 6px;
    }

    .river {
      display: grid;
      gap: 0;
      align-content: start;
    }

    .r-top {
      grid-area: rtop;
      grid-template-columns: repeat(8, auto);
      justify-content: center;
      align-self: end;
      direction: rtl;
    }

    .r-bot {
      grid-area: rbot;
      grid-template-columns: repeat(8, auto);
      justify-content: center;
      align-self: start;
    }

    .r-left {
      grid-area: rleft;
      grid-auto-flow: column;
      grid-template-rows: repeat(6, auto);
      justify-self: end;
      align-self: center;
    }

    .r-right {
      grid-area: rright;
      grid-auto-flow: column;
      grid-template-rows: repeat(6, auto);
      justify-self: start;
      align-self: center;
      direction: rtl;
    }

    .compass {
      grid-area: compass;
      width: 178px;
      height: 178px;
      border-radius: 22px;
      position: relative;
      align-self: center;
      justify-self: center;
      background: radial-gradient(circle at 50% 35%, #2a2f3c, #11141b);
      border: 2px solid var(--gold-lo);
      box-shadow: 0 10px 25px rgba(0, 0, 0, .6), inset 0 0 18px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .compass .mid {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      pointer-events: none;
    }

    .compass .wall {
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .compass .lbl {
      font-size: 11px;
      color: #9a937f;
      margin-top: 3px;
    }

    .compass .dir {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #8b8473;
      transition: color .2s, text-shadow .2s;
      white-space: nowrap;
    }

    .compass .dir.on {
      color: var(--gold-hi);
      text-shadow: 0 0 10px var(--gold);
    }

    .compass .vpill {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
    }

    .compass .vpill.W {
      background: linear-gradient(180deg, #e0533f, #a32515);
      border: 1px solid rgba(255, 180, 165, .5);
    }

    .compass .vpill.T {
      background: linear-gradient(180deg, #2fb363, #176938);
      border: 1px solid rgba(155, 245, 190, .5);
    }

    .compass .vpill.B {
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      border: 1px solid rgba(170, 210, 255, .5);
    }

    .compass .vpill.none {
      background: #2d3343;
      color: #94a3b8;
      font-weight: 500;
    }

    .compass .d0 {
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .compass .d1 {
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: column;
      gap: 2px;
    }

    .compass .d2 {
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .compass .d3 {
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      flex-direction: column;
      gap: 2px;
    }

    .compass .bar {
      position: absolute;
      background: var(--gold);
      border-radius: 3px;
      opacity: 0;
      transition: opacity .2s;
      box-shadow: 0 0 12px var(--gold);
    }

    .compass .bar.on {
      opacity: .9;
    }

    .compass .b0 {
      left: 30%;
      right: 30%;
      bottom: -2px;
      height: 4px;
    }

    .compass .b1 {
      top: 30%;
      bottom: 30%;
      right: -2px;
      width: 4px;
    }

    .compass .b2 {
      left: 30%;
      right: 30%;
      top: -2px;
      height: 4px;
    }

    .compass .b3 {
      top: 30%;
      bottom: 30%;
      left: -2px;
      width: 4px;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
    }

    .burst {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      font-family: "STKaiti", "KaiTi", serif;
      font-size: 84px;
      font-weight: 900;
      letter-spacing: 6px;
      background: linear-gradient(180deg, #fff6d8, #ffd36a 45%, #e08a1e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 #7a3a00) drop-shadow(0 10px 22px rgba(0, 0, 0, .7));
      animation: burst 1.5s ease-out forwards;
      white-space: nowrap;
    }

    .burst small {
      display: block;
      font-size: 26px;
      letter-spacing: 2px;
      text-align: center;
    }

    @keyframes burst {
      0% {
        transform: translate(-50%, -50%) scale(.3);
        opacity: 0;
      }

      18% {
        transform: translate(-50%, -50%) scale(1.12);
        opacity: 1;
      }

      30% {
        transform: translate(-50%, -50%) scale(1);
      }

      80% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -60%) scale(1);
      }
    }
